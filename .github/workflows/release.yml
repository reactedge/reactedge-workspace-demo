name: Publish ReactEdge Platform

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    environment: reactedge

    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      DEPLOY_ROOT: /var/www/docker_mageos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        run: |
          case "$RELEASE_VERSION" in
            v[0-9]*) ;;
            *)
              echo "Release version must start with v, for example v0.1.0"
              exit 1
              ;;
          esac

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s' "${{ secrets.WIDGET_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          
          # Safe diagnostic: prints only the public-key fingerprint
          ssh-keygen -lf ~/.ssh/id_ed25519

          if [ -z "${{ secrets.WIDGET_SSH_HOST }}" ]; then
            echo "ERROR: WIDGET_SSH_HOST not set"
            exit 1
          fi

          ssh-keyscan -H "${{ secrets.WIDGET_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Publish versioned ReactEdge source
        run: |
          RELEASE_DIR="${DEPLOY_ROOT}/reactedge-${RELEASE_VERSION}"

          ssh "${{ secrets.WIDGET_SSH_USER }}@${{ secrets.WIDGET_SSH_HOST }}" \
            "mkdir -p '${RELEASE_DIR}'"

          rsync -avz --delete \
            --exclude ".git" \
            ./ \
            "${{ secrets.WIDGET_SSH_USER }}@${{ secrets.WIDGET_SSH_HOST }}:${RELEASE_DIR}/"

      - name: Activate release
        run: |
          ssh "${{ secrets.WIDGET_SSH_USER }}@${{ secrets.WIDGET_SSH_HOST }}" "
            set -eu
            cd '${DEPLOY_ROOT}'
            ln -s 'reactedge-${RELEASE_VERSION}' reactedge.next
            mv -Tf reactedge.next reactedge
          "